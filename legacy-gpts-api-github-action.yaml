          description: Workflow run ID.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: filter
          in: query
          required: false
          description: Whether to list only the latest attempt or all attempts.
          schema:
            type: string
            enum:
              - latest
              - all
            default: latest
        - name: per_page
          in: query
          required: false
          description: Number of results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: Accept
          in: header
          required: false
          description: GitHub REST API media type.
          schema:
            type: string
            default: application/vnd.github+json
        - name: X-GitHub-Api-Version
          in: header
          required: false
          description: GitHub REST API version.
          schema:
            type: string
            default: "2026-03-10"
      responses:
        "200":
          description: Workflow run jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowJobsResponse"
        "403":
          description: Forbidden or rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubError"
        "404":
          description: Workflow run not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubError"

  /repos/{owner}/{repo}/actions/jobs/{job_id}/logs:
    get:
      operationId: actions_download_job_logs_for_workflow_run
      summary: Download job logs for workflow run job
      description: >
        Gets a temporary redirect URL for downloading plain text job logs.
        Read the URL from the Location response header.
      tags:
        - actions
      parameters:
        - name: owner
          in: path
          required: true
          description: Repository owner or organization login.
          schema:
            type: string
            minLength: 1
        - name: repo
          in: path
          required: true
          description: Repository name without owner.
          schema:
            type: string
            minLength: 1
        - name: job_id
          in: path
          required: true
          description: Workflow job ID.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Accept
          in: header
          required: false
          description: GitHub REST API media type.
          schema:
            type: string
            default: application/vnd.github+json
        - name: X-GitHub-Api-Version
          in: header
          required: false
          description: GitHub REST API version.
          schema:
            type: string
            default: "2026-03-10"
      responses:
        "302":
          description: Redirect URL for downloading job logs.
          headers:
            Location:
              description: Temporary URL for the plain text log file.
              schema:
                type: string
                format: uri
        "403":
          description: Forbidden or rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubError"
        "404":
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubError"

