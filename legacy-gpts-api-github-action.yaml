x-safety-notes:
  - No delete file endpoint.
  - Pull request merge is available only through the guarded merge endpoint.
  - No force update ref endpoint.
  - No repository settings, secrets, collaborators, permissions, or branch protection mutation endpoints.
  - File writes require an explicit branch.
  - Git ref creation is restricted by schema to refs/heads/* branch refs.
  - All write operations are marked with x-openai-isConsequential.