openapi: 3.1.0

info:
  title: GitHub Safe Connector API
  version: 1.1.1
  description: >
    GitHub REST and GraphQL API surface for ChatGPT Actions. Includes repository discovery,
    file and code work, issues, pull requests, guarded merge, GitHub Apps, Actions inspection,
    and GraphQL. Destructive and sensitive operations remain constrained by available endpoints.

servers:
  - url: https://api.github.com
    description: GitHub REST API

security:
  - bearerAuth: []

tags:
  - name: users
  - name: repos
  - name: search
  - name: git
  - name: issues
  - name: pulls
  - name: actions

paths:
  /repos/{owner}/{repo}/git/ref/{ref}:
    get:
      operationId: ref_get
      summary: Get a Git ref
      tags: [git]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: ref, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Git ref. }

  /repos/{owner}/{repo}/git/commits/{commit_sha}:
    get:
      operationId: commit_get
      summary: Get a Git commit
      tags: [git]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: commit_sha, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Git commit. }

  /repos/{owner}/{repo}/git/trees/{tree_sha}:
    get:
      operationId: tree_get
      summary: Get a Git tree
      tags: [git]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: tree_sha, in: path, required: true, schema: { type: string } }
        - { name: recursive, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: Git tree. }

  /repos/{owner}/{repo}/git/blobs/{file_sha}:
    get:
      operationId: blob_get
      summary: Get a Git blob
      tags: [git]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: file_sha, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Git blob. }

  /repos/{owner}/{repo}/git/tags/{tag_sha}:
    get:
      operationId: tag_get
      summary: Get an annotated Git tag
      tags: [git]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: tag_sha, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Annotated tag. }

  /repos/{owner}/{repo}/git/tags:
    post:
      operationId: tag_create
      summary: Create an annotated Git tag
      tags: [git]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag, message, object, type]
              additionalProperties: false
              properties:
                tag: { type: string }
                message: { type: string }
                object: { type: string }
                type: { type: string, enum: [commit, tree, blob] }
                tagger: { type: object, additionalProperties: true }
      responses:
        "201": { description: Annotated tag created. }
      x-openai-isConsequential: true

  /repos/{owner}/{repo}/compare/{basehead}:
    get:
      operationId: commits_compare
      summary: Compare two commits
      description: Compares commits, branches, or tags using BASE...HEAD syntax.
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: basehead, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Commit comparison. }

  /repos/{owner}/{repo}/pulls/{pull_number}/commits:
    get:
      operationId: pull_commits_list
      summary: List pull request commits
      tags: [pulls]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: pull_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Pull request commits. }

  /repos/{owner}/{repo}/pulls/{pull_number}/files:
    get:
      operationId: pull_files_list
      summary: List pull request files
      tags: [pulls]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: pull_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Pull request files. }

  /repos/{owner}/{repo}/pulls/{pull_number}/reviews:
    get:
      operationId: reviews_list
      summary: List pull request reviews
      tags: [pulls]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: pull_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Pull request reviews. }

  /repos/{owner}/{repo}/pulls/{pull_number}/comments:
    get:
      operationId: review_comments_list
      summary: List pull request review comments
      tags: [pulls]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: pull_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Review comments. }

  /repos/{owner}/{repo}/pulls/{pull_number}/update-branch:
    put:
      operationId: pull_update_branch
      summary: Update a pull request branch
      description: Updates the pull request head branch with changes from its base branch. An expected head SHA may be supplied.
      tags: [pulls]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: pull_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_head_sha: { type: string }
      responses:
        "202": { description: Branch update scheduled. }
      x-openai-isConsequential: true

  /repos/{owner}/{repo}/commits/{ref}/check-runs:
    get:
      operationId: check_runs_list
      summary: List check runs for a ref
      tags: [actions]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: ref, in: path, required: true, schema: { type: string } }
        - { name: check_name, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: filter, in: query, required: false, schema: { type: string, enum: [latest, all] } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Check runs. }

  /repos/{owner}/{repo}/check-runs/{check_run_id}:
    get:
      operationId: check_run_get
      summary: Get a check run
      tags: [actions]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: check_run_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Check run. }

  /repos/{owner}/{repo}/commits/{ref}/status:
    get:
      operationId: combined_status_get
      summary: Get combined commit status
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: ref, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Combined commit status. }

  /repos/{owner}/{repo}/actions/runs/{run_id}:
    get:
      operationId: workflow_run_get
      summary: Get a workflow run
      tags: [actions]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: run_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Workflow run. }

  /repos/{owner}/{repo}/actions/jobs/{job_id}:
    get:
      operationId: job_get
      summary: Get a workflow job
      tags: [actions]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: job_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Workflow job. }

  /repos/{owner}/{repo}/actions/runs/{run_id}/logs:
    get:
      operationId: workflow_logs_download
      summary: Download workflow run logs
      description: Returns a redirect to the workflow run log archive when available.
      tags: [actions]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: run_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "302": { description: Redirect to log archive. }

  /repos/{owner}/{repo}/actions/artifacts/{artifact_id}/{archive_format}:
    get:
      operationId: artifact_download
      summary: Download an Actions artifact
      description: Returns a redirect to an artifact archive. The archive format is zip.
      tags: [actions]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: artifact_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: archive_format, in: path, required: true, schema: { type: string, enum: [zip] } }
      responses:
        "302": { description: Redirect to artifact archive. }

  /repos/{owner}/{repo}/releases/tags/{tag}:
    get:
      operationId: release_by_tag_get
      summary: Get a release by tag
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: tag, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Release. }

  /repos/{owner}/{repo}/releases/generate-notes:
    post:
      operationId: release_notes_generate
      summary: Generate release notes
      description: Generates release notes for a tag without creating a release.
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_name]
              additionalProperties: false
              properties:
                tag_name: { type: string }
                target_commitish: { type: string }
                previous_tag_name: { type: string }
                configuration_file_path: { type: string }
      responses:
        "200": { description: Generated release notes. }
      x-openai-isConsequential: true

  /repos/{owner}/{repo}/rulesets/{ruleset_id}:
    get:
      operationId: ruleset_get
      summary: Get a repository ruleset
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: ruleset_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Repository ruleset. }

  /repos/{owner}/{repo}/branches/{branch}:
    get:
      operationId: branch_get
      summary: Get a branch
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: branch, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Branch details. }

  /repos/{owner}/{repo}/collaborators/{username}/permission:
    get:
      operationId: repo_permission_get
      summary: Get a user's repository permission
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Repository permission. }

  /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}:
    get:
      operationId: code_scanning_alert_get
      summary: Get a code scanning alert
      tags: [security]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: alert_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Code scanning alert. }

  /repos/{owner}/{repo}/dependabot/alerts/{alert_number}:
    get:
      operationId: dependabot_alert_get
      summary: Get a Dependabot alert
      tags: [security]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: alert_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Dependabot alert. }

  /repos/{owner}/{repo}/secret-scanning/alerts/{alert_number}:
    get:
      operationId: secret_scanning_alert_get
      summary: Get a secret scanning alert
      tags: [security]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: alert_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Secret scanning alert. }

  /repos/{owner}/{repo}/dispatches:
    post:
      operationId: repository_dispatch
      summary: Dispatch a repository event
      description: Sends a repository_dispatch event with an event type and optional client payload.
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              additionalProperties: false
              properties:
                event_type: { type: string, maxLength: 100 }
                client_payload: { type: object, additionalProperties: true }
      responses:
        "204": { description: Dispatch accepted. }
      x-openai-isConsequential: true

  /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs:
    post:
      operationId: workflow_rerun_failed
      summary: Re-run failed jobs
      description: Re-runs failed jobs and dependent jobs in an existing workflow run.
      tags: [actions]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: run_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "201": { description: Re-run requested. }
      x-openai-isConsequential: true

  /repos/{owner}/{repo}/actions/artifacts:
    get:
      operationId: artifacts_list
      summary: List Actions artifacts
      tags: [actions]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, required: false, schema: { type: string } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Actions artifacts. }

  /repos/{owner}/{repo}/actions/artifacts/{artifact_id}:
    get:
      operationId: artifact_get
      summary: Get an Actions artifact
      tags: [actions]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: artifact_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Artifact metadata. }

  /repos/{owner}/{repo}/deployments:
    get:
      operationId: deployments_list
      summary: List deployments
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: sha, in: query, required: false, schema: { type: string } }
        - { name: ref, in: query, required: false, schema: { type: string } }
        - { name: environment, in: query, required: false, schema: { type: string } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Deployments. }
    post:
      operationId: deployment_create
      summary: Create a deployment
      description: Creates a deployment for a ref with optional environment, payload, task, and production flags.
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              additionalProperties: true
              properties:
                ref: { type: string }
                task: { type: string }
                auto_merge: { type: boolean }
                required_contexts: { type: array, items: { type: string } }
                payload: {}
                environment: { type: string }
                description: { type: string }
                transient_environment: { type: boolean }
                production_environment: { type: boolean }
      responses:
        "201": { description: Deployment created. }
      x-openai-isConsequential: true

  /repos/{owner}/{repo}/deployments/{deployment_id}/statuses:
    get:
      operationId: deployment_statuses_list
      summary: List deployment statuses
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: deployment_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Deployment statuses. }
    post:
      operationId: deployment_status_create
      summary: Create a deployment status
      description: Creates a deployment status such as queued, in_progress, success, failure, error, or inactive.
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: deployment_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              additionalProperties: false
              properties:
                state: { type: string, enum: [error, failure, inactive, in_progress, queued, pending, success] }
                target_url: { type: string }
                log_url: { type: string }
                description: { type: string }
                environment: { type: string }
                environment_url: { type: string }
                auto_inactive: { type: boolean }
      responses:
        "201": { description: Deployment status created. }
      x-openai-isConsequential: true

  /repos/{owner}/{repo}/environments:
    get:
      operationId: environments_list
      summary: List environments
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Repository environments. }

  /repos/{owner}/{repo}/environments/{environment_name}:
    get:
      operationId: environment_get
      summary: Get an environment
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: environment_name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Environment details. }

  /repos/{owner}/{repo}/releases/{release_id}/assets:
    get:
      operationId: release_assets_list
      summary: List release assets
      tags: [repos]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: release_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Release assets. }
    post:
      operationId: release_asset_upload
      summary: Upload a release asset
      description: Uploads binary content to a release through uploads.github.com and requires a name query parameter.
      tags: [repos]
      servers:
        - url: https://uploads.github.com
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: release_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: label, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Release asset uploaded. }
      x-openai-isConsequential: true

  /repos/{owner}/{repo}/labels:
    get:
      operationId: labels_list
      summary: List labels
      tags: [issues]
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Labels. }
    post:
