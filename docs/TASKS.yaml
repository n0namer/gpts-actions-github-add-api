project:
  id: github-add
  name: GitHub ADD
  north_star: >
    Give GPTS safe additional GitHub patch commands for partial text-file edits:
    preview diff, apply patch, commit, reread evidence.
  active_project_id: github-add
  source_of_truth:
    - docs/HANDOFF_FOR_NEXT_LLM.md
    - docs/DEPLOYMENT_REPORT.md
    - src/server.mjs
    - src/openapi.mjs
    - tests/server.test.mjs
    - docs/TASKS.yaml
  current_phase: GPTS action integration and first real write-back
  current_stage: stage_6_gpts_delivery
  stage_verdict: >
    MVP backend is DONE. GPTS UI import/action verification is not yet DONE because
    GPT Builder UI must be configured outside this repository.

constraints:
  mvp_auth: existing GitHub token stored only as Railway secret
  no_github_app_in_mvp: true
  no_n8n_control_merge: true
  no_universal_github_operator: true
  patch_core: kpdecker/jsdiff / npm package diff
  github_client: '@octokit/rest'
  runtime: standalone Railway service
  service_name: github-add-api
  railway_project: github-add
  secret_policy: never print, echo, log, or commit token values
  priority: money_speed_cheapest_first_then_optimization

statuses:
  allowed: [PLANNED, IN_PROGRESS, DONE, PARTIAL, BLOCKED, HYPOTHESIS, EVIDENCE_MISSING, BLOCKED_BY_UI]

stages:
  - id: stage_0_bootstrap
    name: Bootstrap service
    status: DONE
    evidence: [package.json, src/server.mjs, tests/server.test.mjs, docs/DEPLOYMENT_REPORT.md]
  - id: stage_1_patch_engine
    name: Pure patch engine
    status: DONE
    evidence: [src/patch.mjs, tests/server.test.mjs]
  - id: stage_2_github_io
    name: GitHub read/update
    status: DONE
    evidence:
      - src/github.mjs
      - smoke apply commit 7f0c84f43d2f0175cbe19770a732e5f4d90445ec
      - fixture restore commit 74a353d722ca47aa5e3a7be8b156f36c048916f1
  - id: stage_3_safety
    name: Safety gates
    status: DONE
    evidence: [src/safety.mjs, docs/DEPLOYMENT_REPORT.md negative smoke checks]
  - id: stage_4_api
    name: Public patch API
    status: DONE
    evidence: [src/openapi.mjs, docs/DEPLOYMENT_REPORT.md]
  - id: stage_5_railway
    name: Railway deployment
    status: DONE
    evidence: [docs/DEPLOYMENT_REPORT.md, github-add-api-production.up.railway.app]
  - id: stage_6_gpts_delivery
    name: GPTS action delivery and first useful write-back
    status: PLANNED
    dod:
      - GPT Builder imports OpenAPI schema
      - GPTS action health call PASS
      - GPTS action preview/apply/restore smoke PASS
      - first non-fixture doc write-back through GitHub ADD PASS
      - write-back evidence recorded

tasks:
  - task_id: GHA-001
    stage: stage_0_bootstrap
    action: Create minimal service skeleton
    status: DONE
    evidence_required: [package.json, src/server.mjs, tests/server.test.mjs]
    validator: local tests and Railway health
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-002
    stage: stage_1_patch_engine
    action: Implement marker patch functions
    status: DONE
    evidence_required: [src/patch.mjs, tests/server.test.mjs]
    validator: unit tests
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-003
    stage: stage_1_patch_engine
    action: Add diff preview generation
    status: DONE
    evidence_required: [diff_preview in smoke report]
    validator: preview smoke
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-004
    stage: stage_2_github_io
    action: Implement GitHub read/update client
    status: DONE
    evidence_required: [commit_sha, reread proof]
    validator: live apply smoke
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-005
    stage: stage_3_safety
    action: Implement safety gates
    status: DONE
    evidence_required: [409 wrong SHA, 422 missing marker, 422 duplicate marker, protected path blocked]
    validator: live negative smoke
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-006
    stage: stage_4_api
    action: Implement /patch/preview
    status: DONE
    evidence_required: [DRY_RUN_PASS, markers_found]
    validator: live preview smoke
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-007
    stage: stage_4_api
    action: Implement /patch/apply
    status: DONE
    evidence_required: [APPLY_PASS, commit_sha, reread_verified true]
    validator: live apply smoke
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-008
    stage: stage_4_api
    action: Add minimal OpenAPI schema
    status: DONE
    evidence_required: [GET /openapi.json returns OpenAPI 3.1.0 and 3 paths]
    validator: live OpenAPI smoke
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-009
    stage: stage_5_railway
    action: Deploy to Railway
    status: DONE
    evidence_required: [Railway service URL, deployment SUCCESS, /health HTTP 200]
    validator: Railway deployment status and public health
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-010
    stage: stage_5_railway
    action: Run E2E preview/apply smoke
    status: DONE
    evidence_required: [HTTP preview response, HTTP apply response, commit sha, reread proof, negative test responses]
    validator: full live smoke
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-PIPE-001
    stage: stage_6_gpts_delivery
    action: Synchronize task ledger with actual backend evidence
    edit_steps:
      - Update docs/TASKS.yaml statuses and current_phase
      - Keep DONE only for tasks with evidence and validator PASS
      - Add GPTS delivery next tasks
    dod:
      - docs/TASKS.yaml no longer says MVP planning
      - done tasks cite deployment report evidence
    evidence_required: [commit 8ed2ef497ee9793c1d30e929a177aa7b488631a3, docs/DEPLOYMENT_REPORT.md]
    validator: reread docs/TASKS.yaml
    owner_tool: GitHub connector
    dependencies: [GHA-010]
    status: DONE
    write_back_target: docs/TASKS.yaml
  - task_id: GHA-ACT-001
    stage: stage_6_gpts_delivery
    action: Prepare GPTS Action import instructions
    edit_steps:
      - Add docs/GPTS_ACTION_SETUP.md
      - Include schema URL and operation mapping
      - Include safe fixture smoke steps
      - Mark GPT Builder import as manual UI step
    dod:
      - setup doc exists
      - schema URL and operations documented
      - no secrets documented
    evidence_required: [commit e8b4046ad8d8d1dd6a367d659891f6aa2ef1f639, docs/GPTS_ACTION_SETUP.md]
    validator: doc review plus schema URL smoke
    owner_tool: GitHub connector
    dependencies: [GHA-PIPE-001]
    status: DONE
    write_back_target: docs/GPTS_ACTION_SETUP.md
  - task_id: GHA-ACT-002
    stage: stage_6_gpts_delivery
    action: Import OpenAPI into GPT Builder
    edit_steps:
      - Open GPT Builder Actions
      - Import https://github-add-api-production.up.railway.app/openapi.json
      - Save action
      - Run health operation
    dod:
      - GPT Builder import PASS
      - GPTS health action returns HTTP 200
    evidence_required:
      - GPT Builder import confirmation or screenshot/log
      - health response from GPTS action
    validator: GPTS action health call
    owner_tool: User / GPT Builder UI
    dependencies: [GHA-ACT-001]
    status: BLOCKED_BY_UI
    write_back_target: docs/GPTS_ACTION_SETUP.md
  - task_id: GHA-ACT-003
    stage: stage_6_gpts_delivery
    action: GPTS action preview/apply/restore smoke
    edit_steps:
      - Read fixture SHA via GitHub connector
      - Call preview through GPTS Action
      - Inspect diff
      - Call apply through GPTS Action
      - Reread fixture
      - Restore fixture
      - Record evidence
    dod:
      - preview PASS
      - apply PASS
      - commit_sha present
      - reread_verified true
      - fixture restored
    evidence_required: [patch_id, apply commit_sha, restore commit_sha, reread proof]
    validator: GPTS action E2E smoke
    owner_tool: GPTS Action + GitHub connector
    dependencies: [GHA-ACT-002]
    status: BLOCKED_BY_UI
    write_back_target: docs/DEPLOYMENT_REPORT.md
  - task_id: GHA-USE-001
    stage: stage_6_gpts_delivery
    action: First useful non-fixture doc write-back through GitHub ADD
    edit_steps:
      - Add a marker block to docs/GPTS_ACTION_SETUP.md
      - Use GitHub ADD preview/apply to update only that block
      - Reread and record commit_sha
    dod:
      - non-fixture doc updated by GitHub ADD
      - marker-bounded diff only
      - reread proof recorded
    evidence_required: [preview diff, commit_sha, reread proof]
    validator: marker-bounded doc write-back smoke
    owner_tool: GPTS Action + GitHub ADD
    dependencies: [GHA-ACT-003]
    status: PLANNED
    write_back_target: docs/GPTS_ACTION_SETUP.md
  - task_id: GHA-OBS-001
    stage: stage_6_gpts_delivery
    action: Add minimal operations runbook
    edit_steps:
      - Add docs/RUNBOOK.md
      - Document 200/409/422/423/500 diagnosis
      - Document rollback and restore path
    dod:
      - runbook exists
      - errors map to corrective steps
      - no secrets included
    evidence_required: [commit 624efe2a7aaeb9d09724c27d26f9c49df8f0d0ce, docs/RUNBOOK.md]
    validator: doc review
    owner_tool: GitHub connector
    dependencies: [GHA-PIPE-001]
    status: DONE
    write_back_target: docs/RUNBOOK.md

replan_hooks:
  after_evidence_gap:
    action: Stop ACCEPT, mark task EVIDENCE_MISSING, add the smallest evidence-collection task, then retry validator.
  after_failed_validator:
    action: Mark FAILED or PARTIAL, record exact validator output, create corrective task, do not continue dependent tasks.
  after_blocker:
    action: Mark BLOCKED or BLOCKED_BY_UI, record unblock owner and condition, switch to independent cheap lane if available.
  after_goal_source_or_dod_change:
    action: Reread source_of_truth, update North Star/DoD, invalidate affected planned tasks to HYPOTHESIS until revalidated.
  after_accept_partial_blocked:
    action: Write back status, evidence, validator result, next cheapest task, and replan queue.
